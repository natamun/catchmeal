x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Rendu stack: everything is built locally from the *_rendu Dockerfiles
# (no `image:` pulled from ghcr.io), so it also works on a machine where
# you can't `docker login` to a private registry. Caddy is the only
# service with published ports; it terminates HTTPS and reverse-proxies
# to both containers over the internal docker network.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile_renduFront
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile_renduBack
    env_file:
      - ./backend/.env
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.11
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./logs/caddy:/var/log/caddy
      - caddy_data_rendu:/data
      - caddy_config_rendu:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data_rendu:
  caddy_config_rendu:
