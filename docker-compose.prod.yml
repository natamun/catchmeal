x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    image: ghcr.io/natamun/catchmeal-frontend:${TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  backend:
    image: ghcr.io/natamun/catchmeal-backend:${TAG:-latest}
    env_file:
      - ./backend/.env
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.11
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./logs/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config: