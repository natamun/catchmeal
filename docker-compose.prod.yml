services:
  frontend:
    image: ghcr.io/natamun/catchmeal-frontend:latest
    restart: unless-stopped
    networks:
      - proxy

  backend:
    image: ghcr.io/natamun/catchmeal-backend:latest
    env_file:
      - ./backend/.env
    environment:
      FRONTEND_URL: ${FRONTEND_URL}
    restart: unless-stopped
    networks:
      - proxy
      - internal

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
  internal:
    internal: true

volumes:
  caddy_data:
  caddy_config: